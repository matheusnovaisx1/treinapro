<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TreinaPro</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1626; color: #f4f7fb;
        font-family: -apple-system, system-ui, sans-serif; }
      .center { height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 18px; }
      .dumbbell { width: 84px; height: 84px; }
      @keyframes lift { 0%,100% { transform: translateY(4px) rotate(-8deg); } 50% { transform: translateY(-12px) rotate(8deg); } }
      .dumbbell { animation: lift .85s ease-in-out infinite; transform-origin: 50% 50%; }
      p { color: #9aa6ba; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="center">
      <svg class="dumbbell" viewBox="0 0 100 100" fill="none">
        <rect x="14" y="38" width="8" height="24" rx="4" fill="#f2600f" />
        <rect x="78" y="38" width="8" height="24" rx="4" fill="#f2600f" />
        <rect x="23" y="31" width="11" height="38" rx="5" fill="#f97316" />
        <rect x="66" y="31" width="11" height="38" rx="5" fill="#f97316" />
        <rect x="34" y="45" width="32" height="10" rx="4" fill="#f97316" />
      </svg>
      <p>Carregando o TreinaPro…</p>
    </div>
  </body>
</html>
